<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Not on the bench · samsbench</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;800&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/bench.css">
<style>
.lost{padding-bottom:20px}
.lost h1{font:800 clamp(40px,7vw,76px)/.95 "Big Shoulders Stencil Display",Impact,sans-serif;margin:10px 0 12px;color:var(--paint);
  background:var(--board);display:inline-block;padding:4px 10px 4px 0}
.lost .outline{margin:6px 0 0}
.tl{list-style:none;margin:24px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tl li a{display:block;background:var(--tag);color:var(--tag-ink);text-decoration:none;padding:12px 14px 12px 26px;position:relative;
  clip-path:polygon(12px 0,100% 0,100% 100%,12px 100%,0 50%);box-shadow:inset 0 0 0 1px var(--tag-edge)}
.tl li a::before{content:"";position:absolute;left:10px;top:50%;width:7px;height:7px;margin-top:-4px;border-radius:50%;background:var(--board)}
.tl b{display:block;font:800 24px/1 "Big Shoulders Stencil Display",Impact,sans-serif;letter-spacing:.02em}
.tl span{font-size:15px}
.tl li a:hover b{text-decoration:underline}
@media (max-width:640px){.tl{grid-template-columns:1fr}}
</style>
<script data-goatcounter="https://familyformals.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script src="/site.js" defer></script>
</head>
<body>
<header class="board lost">
  <div class="wrap">
    <nav class="topnav" aria-label="Site"><a href="/">All tools</a><a href="/my/">Your bench</a><a href="/#ask">Ask for a tool</a><a href="/about/">About</a></nav>
    <p class="mark"><a href="/" style="color:var(--ink);text-decoration:none">SAMSBENCH</a></p>
    <h1>NOTHING HANGS ON THIS PEG</h1>
    <p class="lede">That address isn't on the bench. If a link brought you here, the tool is probably one of these.</p>

    <form class="find" id="find" role="search" onsubmit="return false">
      <label class="find-label" for="find-q">What do you do?</label>
      <div class="find-row">
        <input id="find-q" type="search" autocomplete="off" spellcheck="false" placeholder="florist, piano teacher, Airbnb, sourdough&hellip;">
        <button type="button" id="find-clear" class="find-clear">Show all</button>
      </div>
      <p class="find-status" id="find-status" role="status" aria-live="polite"></p>
    </form>
    <div class="none" id="find-none" hidden>
      <p class="paint">NOTHING FOR &ldquo;<span id="none-q"></span>&rdquo; YET</p>
      <p class="none-sub"><a href="/#ask">Tell me the job you still do by hand</a></p>
    </div>
    <ul class="tl" id="tl" data-rack><noscript><li><a href="/"><b>See every tool</b><span>on the home page</span></a></li></noscript></ul>
  </div>
</header>
<footer class="foot">
  <div class="wrap narrow">samsbench · <a href="/">All tools</a> · <a href="/privacy/">Privacy</a> · <a href="mailto:sam@samsbench.com">sam@samsbench.com</a></div>
</footer>
</body>
</html>
